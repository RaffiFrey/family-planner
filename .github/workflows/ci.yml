name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build
      - name: Contract check (OpenAPI is generated from @fp/contracts)
        run: pnpm --filter @fp/api openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi/

  integration:
    name: API integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter "@fp/api^..."
      - run: pnpm --filter @fp/api test:integration

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/terraform/scaleway

  e2e-web:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env && docker compose -f infra/docker-compose.yml up -d --wait postgres redis s3 mailpit
      - run: pnpm turbo run build --filter "@fp/api..." --filter "@fp/web..."
      - run: pnpm db:migrate && pnpm db:seed
      - run: (pnpm --filter @fp/api start > api.log 2>&1 &) && npx wait-on http://localhost:4000/v1/health
        env:
          NODE_OPTIONS: --env-file=../../.env
      - run: pnpm --filter @fp/web exec playwright install --with-deps chromium
      - run: pnpm --filter @fp/web exec playwright test --project=chromium
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report/
            api.log

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        app: [api, web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: false
          tags: family-planer-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
