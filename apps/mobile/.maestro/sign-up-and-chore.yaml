# Native E2E on an Android emulator/device (English system language) with the debug build
# installed, Metro running and the API reachable (adb reverse tcp:8081 / tcp:4000):
#   maestro test apps/mobile/.maestro
appId: app.familyplaner.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'No account yet\? Sign up'
    timeout: 90000
- tapOn: 'No account yet\? Sign up'
# Stable ids instead of label positions: screen sizes differ between emulators, and Android's
# hideKeyboard can fall back to the back button, which leaves the sign-up screen.
- tapOn:
    id: 'auth-name'
- inputText: 'Maestro'
- tapOn:
    id: 'auth-email'
- inputRandomEmail
- tapOn:
    id: 'auth-password'
- inputText: 'correct-horse-battery'
- scrollUntilVisible:
    element:
      id: 'auth-submit'
- tapOn:
    id: 'auth-submit'
- extendedWaitUntil:
    visible: 'Create a household'
    timeout: 30000
- tapOn:
    id: 'household-name'
- inputText: 'Familie Maestro'
- scrollUntilVisible:
    element:
      id: 'household-create'
- tapOn:
    id: 'household-create'
- extendedWaitUntil:
    visible: 'Tasks'
    timeout: 30000
- tapOn: 'Tasks'
- tapOn: 'New task'
- tapOn:
    below: 'Title'
    index: 0
- inputText: 'Water the plants'
- hideKeyboard
- scrollUntilVisible:
    element: 'Save'
- tapOn: 'Save'
- extendedWaitUntil:
    visible: 'Water the plants'
    timeout: 15000
- tapOn: 'Complete "Water the plants"'
- extendedWaitUntil:
    notVisible: 'Complete "Water the plants"'
    timeout: 10000
